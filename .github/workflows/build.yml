name: Build APK & IOS

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      signed_ios:
        description: Export signed IPA (requires Apple signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # Install only the supported platform-tools package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK and run shared tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: Pingly-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # Temporarily disabled; remove this condition to resume IPA builds.
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_ios }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.thangnq.pingly.Pingly' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and package iOS
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          chmod +x gradlew
          bash .github/scripts/build-ios.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Pingly-ios-${{ env.SIGNED_IOS == 'true' && 'signed' || 'unsigned' }}
          path: build/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 14
